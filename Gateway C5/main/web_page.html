<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Ape Self-Balancing Robot Controller</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-user-drag: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #111;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('/background.jpg') no-repeat center center;
            background-size: cover;
            pointer-events: none;
            z-index: 0;
        }

        .app-shell {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding:
                max(8px, env(safe-area-inset-top))
                max(10px, env(safe-area-inset-right))
                max(8px, env(safe-area-inset-bottom))
                max(10px, env(safe-area-inset-left));
            z-index: 1;
        }

        .control-panel {
            width: 100%;
            height: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
            gap: clamp(10px, 3vw, 30px);
        }

        .info-panel {
            flex: 0 0 30%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2vh, 18px);
            min-width: 0;
        }

        h3 {
            color: white;
            font-size: clamp(15px, 2.5vw, 23px);
            text-align: center;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .ws-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: clamp(9px, 1.5vw, 12px);
            font-weight: bold;
            color: white;
            background: rgba(235, 77, 75, 0.85);
            text-align: center;
            max-width: 100%;
        }

        .ws-badge.connected {
            background: rgba(0, 184, 148, 0.85);
        }

        .telemetry-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.5vh, 14px);
            pointer-events: none;
        }

        .telemetry-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            color: #dcdde1;
            padding: clamp(7px, 1.5vh, 12px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-size: clamp(10px, 1.7vw, 14px);
            text-align: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .telemetry-value {
            display: block;
            font-size: clamp(20px, 4vw, 32px);
            font-weight: bold;
            color: #00ffcc;
            margin-top: 3px;
        }

        .angle-value {
            color: #ffbe76;
        }

        .control-area {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, clamp(54px, 13vh, 82px));
            grid-template-rows: repeat(3, clamp(54px, 13vh, 82px));
            gap: clamp(6px, 1.5vh, 12px);
            justify-content: center;
            align-content: center;
        }

        .btn {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: transform 0.08s ease, background 0.08s ease;
            touch-action: none;
        }

        .btn-diag {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn svg {
            width: 42%;
            height: 42%;
            fill: white;
            pointer-events: none;
        }

        .btn.pressing {
            background: rgba(0, 255, 204, 0.65);
            border-color: #00ffcc;
            transform: scale(0.90);
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
        }

        .btn-stop {
            background: rgba(235, 77, 75, 0.75);
        }

        .btn-stop.pressing {
            background: rgba(255, 77, 75, 1);
            border-color: #ff4d4b;
            box-shadow: 0 0 12px rgba(255, 77, 75, 0.8);
        }

        /* Wi-Fi settings button */
        .settings-button {
            width: 100%;
            max-width: 180px;
            padding: 9px 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            font-size: clamp(10px, 1.5vw, 13px);
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            pointer-events: auto;
        }

        .settings-button:active {
            background: rgba(0, 184, 148, 0.85);
        }

        /* Wi-Fi settings modal */
        .settings-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.78);
            touch-action: manipulation;
        }

        .settings-overlay.show {
            display: flex;
        }

        .settings-card {
            width: 100%;
            max-width: 360px;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            background: #20252b;
            color: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            touch-action: manipulation;
        }

        .settings-card h3 {
            margin-bottom: 20px;
            font-size: 19px;
        }

        .settings-label {
            display: block;
            margin-bottom: 9px;
            color: #dcdde1;
            font-size: 13px;
            text-align: left;
        }

        .channel-select {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #111820;
            color: white;
            font-size: 15px;
            outline: none;
            touch-action: manipulation;
            -webkit-user-select: auto !important;
            user-select: auto !important;
        }

        .channel-current {
            margin-top: 13px;
            color: #00ffcc;
            font-size: 12px;
            text-align: left;
        }

        .channel-message {
            min-height: 34px;
            margin-top: 12px;
            color: #ffbe76;
            font-size: 12px;
            line-height: 1.5;
            text-align: left;
        }

        .settings-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .settings-action {
            flex: 1;
            padding: 11px 8px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .settings-close {
            background: #555;
        }

        .settings-save {
            background: #009b79;
        }

        .settings-action:disabled {
            opacity: 0.5;
        }

        @media screen and (orientation: portrait) {
            .app-shell {
                width: 100dvh;
                height: 100vw;
                top: 0;
                left: 0;
                right: auto;
                bottom: auto;
                transform-origin: top left;
                transform: translateX(100vw) rotate(90deg);
            }

            .grid-container {
                grid-template-columns: repeat(3, clamp(48px, 13vw, 76px));
                grid-template-rows: repeat(3, clamp(48px, 13vw, 76px));
                gap: clamp(5px, 1.5vw, 10px);
            }

            .info-panel {
                flex-basis: 30%;
            }
        }

        @media screen and (max-height: 380px) and (orientation: landscape) {
            .grid-container {
                grid-template-columns: repeat(3, min(18vh, 62px));
                grid-template-rows: repeat(3, min(18vh, 62px));
                gap: 5px;
            }

            .control-panel {
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <div class="control-panel">

            <div class="info-panel">
                <h3>ĐIỀU KHIỂN XE</h3>

                <div id="ws-status" class="ws-badge">
                    ĐANG KẾT NỐI...
                </div>

                <div class="telemetry-container">
                    <div class="telemetry-box">
                        VẬN TỐC
                        <span id="speed-val" class="telemetry-value">0.0</span>
                    </div>

                    <div class="telemetry-box">
                        GÓC NGHIÊNG
                        <span class="telemetry-value angle-value">
                            <span id="angle-val">0.0</span>°
                        </span>
                    </div>
                </div>

                <button id="settings-open" class="settings-button">
                    ⚙ CÀI ĐẶT WI-FI
                </button>
            </div>

            <div class="control-area">
                <div class="grid-container">

                    <div class="btn btn-diag move-btn" data-cmd="FL">
                        <svg viewBox="0 0 24 24" style="transform: rotate(-45deg)">
                            <path d="M12 4l-10 14h20z"/>
                        </svg>
                    </div>

                    <div class="btn move-btn" data-cmd="F">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 4l-10 14h20z"/>
                        </svg>
                    </div>

                    <div class="btn btn-diag move-btn" data-cmd="FR">
                        <svg viewBox="0 0 24 24" style="transform: rotate(45deg)">
                            <path d="M12 4l-10 14h20z"/>
                        </svg>
                    </div>

                    <div class="btn move-btn" data-cmd="L">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 12l14-10v20z"/>
                        </svg>
                    </div>

                    <div class="btn btn-stop" id="stop-btn">
                        <svg viewBox="0 0 24 24">
                            <rect x="5" y="5" width="14" height="14" rx="2"/>
                        </svg>
                    </div>

                    <div class="btn move-btn" data-cmd="R">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 12l-14 10v-20z"/>
                        </svg>
                    </div>

                    <div class="btn btn-diag move-btn" data-cmd="BL">
                        <svg viewBox="0 0 24 24" style="transform: rotate(-135deg)">
                            <path d="M12 4l-10 14h20z"/>
                        </svg>
                    </div>

                    <div class="btn move-btn" data-cmd="B">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 20l10-14h-20z"/>
                        </svg>
                    </div>

                    <div class="btn btn-diag move-btn" data-cmd="BR">
                        <svg viewBox="0 0 24 24" style="transform: rotate(135deg)">
                            <path d="M12 4l-10 14h20z"/>
                        </svg>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Wi-Fi settings dialog -->
    <div id="settings-overlay" class="settings-overlay" aria-hidden="true">
        <div class="settings-card" role="dialog" aria-modal="true"
             aria-labelledby="settings-title">

            <h3 id="settings-title">CÀI ĐẶT WI-FI</h3>

            <label class="settings-label" for="wifi-channel">
                Chọn kênh Wi-Fi 5 GHz
            </label>

            <select id="wifi-channel" class="channel-select">
                <option value="36">Kênh 36 (5180 MHz)</option>
                <option value="40">Kênh 40 (5200 MHz)</option>
                <option value="44">Kênh 44 (5220 MHz)</option>
                <option value="48">Kênh 48 (5240 MHz)</option>
                <option value="149">Kênh 149 (5745 MHz)</option>
                <option value="153">Kênh 153 (5765 MHz)</option>
                <option value="157">Kênh 157 (5785 MHz)</option>
                <option value="161">Kênh 161 (5805 MHz)</option>
                <option value="165">Kênh 165 (5825 MHz)</option>
            </select>

            <div id="channel-current" class="channel-current">
                Đang tải cấu hình...
            </div>

            <div id="channel-message" class="channel-message"></div>

            <div class="settings-actions">
                <button id="settings-close"
                        class="settings-action settings-close">
                    Đóng
                </button>

                <button id="channel-save"
                        class="settings-action settings-save">
                    Lưu kênh
                </button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let wsReady = false;
        let reconnectTimer = null;
        let desiredCmd = 'S';
        let lastSentCmd = 'S';
        let isTouchDevice = false;

        const statusBadge = document.getElementById('ws-status');

        window.addEventListener('contextmenu', e => e.preventDefault(), {
            passive: false
        });

        document.addEventListener('selectstart', e => {
            if (!e.target.closest('.settings-card')) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            if (e.target.closest('.settings-card')) return;

            if (e.cancelable) e.preventDefault();
        }, { passive: false });

        // Request landscape orientation when supported.
        let orientationLockRequested = false;

        function requestLandscape() {
            if (orientationLockRequested) return;
            orientationLockRequested = true;

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        document.addEventListener('touchstart', requestLandscape, {
            once: true,
            passive: true
        });

        document.addEventListener('click', requestLandscape, {
            once: true
        });

        function setStatus(connected) {
            wsReady = connected;

            if (connected) {
                statusBadge.innerText = 'WS SẴN SÀNG';
                statusBadge.classList.add('connected');
            } else {
                statusBadge.innerText = 'MẤT KẾT NỐI - ĐANG THỬ LẠI...';
                statusBadge.classList.remove('connected');
            }
        }

        function connectWS() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            const host = window.location.hostname || '192.168.4.1';
            ws = new WebSocket('ws://' + host + ':81/');

            ws.onopen = () => {
                setStatus(true);
                lastSentCmd = '';
                sendCmd(true);
            };

            ws.onmessage = (e) => {
                if (typeof e.data === 'string' && e.data.startsWith('T:')) {
                    const parts = e.data.substring(2).split(',');

                    if (parts.length === 2) {
                        document.getElementById('speed-val').innerText = parts[0];
                        document.getElementById('angle-val').innerText = parts[1];
                    }
                }
            };

            ws.onclose = () => {
                setStatus(false);
                reconnectTimer = setTimeout(connectWS, 600);
            };

            ws.onerror = () => {
                try {
                    ws.close();
                } catch (err) {}
            };
        }

        function computeDesiredCmd() {
            let d = '';
            let t = '';

            document.querySelectorAll('.move-btn.pressing').forEach(btn => {
                const c = btn.getAttribute('data-cmd');

                if (c.indexOf('F') !== -1) d = 'F';
                else if (c.indexOf('B') !== -1) d = 'B';

                if (c.indexOf('L') !== -1) t = 'L';
                else if (c.indexOf('R') !== -1) t = 'R';
            });

            const combined = d + t;
            return combined === '' ? 'S' : combined;
        }

        function sendCmd(force = false) {
            if (!wsReady || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (!force && desiredCmd === lastSentCmd) return;

            ws.send(desiredCmd);
            lastSentCmd = desiredCmd;
        }

        function updateMotion() {
            desiredCmd = computeDesiredCmd();
            sendCmd(false);
        }

        function stopAll() {
            document.querySelectorAll('.move-btn').forEach(b => {
                b.classList.remove('pressing');
            });

            desiredCmd = 'S';
            sendCmd(true);
        }

        // Keepalive every 300 ms while moving.
        setInterval(() => {
            if (wsReady && ws &&
                ws.readyState === WebSocket.OPEN &&
                desiredCmd !== 'S') {
                ws.send('K');
            }
        }, 300);

        document.querySelectorAll('.move-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                isTouchDevice = true;

                if (e.cancelable) e.preventDefault();
                e.stopPropagation();

                btn.classList.add('pressing');
                updateMotion();
            }, { passive: false });

            const handleTouchEnd = (e) => {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();

                if (e.targetTouches && e.targetTouches.length > 0) return;
                if (!btn.classList.contains('pressing')) return;

                btn.classList.remove('pressing');
                updateMotion();
            };

            btn.addEventListener('touchend', handleTouchEnd, {
                passive: false
            });

            btn.addEventListener('touchcancel', handleTouchEnd, {
                passive: false
            });

            btn.addEventListener('mousedown', (e) => {
                if (isTouchDevice) return;

                e.preventDefault();
                btn.classList.add('pressing');
                updateMotion();
            });

            const handleMouseRelease = () => {
                if (isTouchDevice) return;
                if (!btn.classList.contains('pressing')) return;

                btn.classList.remove('pressing');
                updateMotion();
            };

            btn.addEventListener('mouseup', handleMouseRelease);
            btn.addEventListener('mouseleave', handleMouseRelease);
        });

        const stopBtn = document.getElementById('stop-btn');

        const emergencyStop = (e) => {
            if (e.cancelable) e.preventDefault();

            stopBtn.classList.add('pressing');
            stopAll();
        };

        stopBtn.addEventListener('touchstart', emergencyStop, {
            passive: false
        });

        stopBtn.addEventListener('touchend', (e) => {
            if (e.cancelable) e.preventDefault();
            stopBtn.classList.remove('pressing');
        }, { passive: false });

        stopBtn.addEventListener('mousedown', (e) => {
            if (isTouchDevice) return;
            emergencyStop(e);
        });

        stopBtn.addEventListener('mouseup', () => {
            stopBtn.classList.remove('pressing');
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && desiredCmd !== 'S') {
                stopAll();
            }
        });

        // Wi-Fi channel settings.
        const settingsOverlay = document.getElementById('settings-overlay');
        const settingsOpen = document.getElementById('settings-open');
        const settingsClose = document.getElementById('settings-close');
        const channelSelect = document.getElementById('wifi-channel');
        const channelCurrent = document.getElementById('channel-current');
        const channelMessage = document.getElementById('channel-message');
        const channelSave = document.getElementById('channel-save');

        const validChannels = [
            36, 40, 44, 48, 149, 153, 157, 161, 165
        ];

        function openSettings() {
            settingsOverlay.classList.add('show');
            settingsOverlay.setAttribute('aria-hidden', 'false');

            channelMessage.innerText = '';
            loadWifiChannel();
        }

        function closeSettings() {
            settingsOverlay.classList.remove('show');
            settingsOverlay.setAttribute('aria-hidden', 'true');
        }

        async function loadWifiChannel() {
            channelCurrent.innerText = 'Đang tải cấu hình...';
            channelMessage.innerText = '';

            try {
                const response = await fetch('/api/wifi/channel', {
                    method: 'GET',
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();
                const channel = Number(data.channel);

                if (!validChannels.includes(channel)) {
                    throw new Error('Kênh trả về không hợp lệ');
                }

                channelSelect.value = String(channel);
                channelCurrent.innerText =
                    'Kênh đang lưu: ' + channel;

            } catch (err) {
                channelCurrent.innerText =
                    'Không đọc được cấu hình Wi-Fi.';

                channelMessage.innerText =
                    'Lỗi: ' + err.message;
            }
        }

        async function saveWifiChannel() {
            const channel = Number(channelSelect.value);

            if (!validChannels.includes(channel)) {
                channelMessage.innerText = 'Kênh không hợp lệ.';
                return;
            }

            channelSave.disabled = true;
            channelMessage.innerText = 'Đang lưu cấu hình...';

            try {
                const response = await fetch('/api/wifi/channel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        channel: channel
                    })
                });

                if (!response.ok) {
                    let errorMessage = 'HTTP ' + response.status;

                    try {
                        const errorData = await response.json();
                        if (errorData.error) {
                            errorMessage = errorData.error;
                        }
                    } catch (err) {}

                    throw new Error(errorMessage);
                }

                const data = await response.json();

                channelCurrent.innerText =
                    'Kênh đã lưu: ' + channel;

                channelMessage.innerText =
                    'Đã lưu thành công. Hãy khởi động lại Gateway để áp dụng kênh mới.';

            } catch (err) {
                channelMessage.innerText =
                    'Không thể lưu kênh: ' + err.message;

            } finally {
                channelSave.disabled = false;
            }
        }

        settingsOpen.addEventListener('click', openSettings);
        settingsOpen.addEventListener('touchstart', (e) => {
            e.stopPropagation();
        }, { passive: true });

        settingsClose.addEventListener('click', closeSettings);
        channelSave.addEventListener('click', saveWifiChannel);

        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) {
                closeSettings();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' &&
                settingsOverlay.classList.contains('show')) {
                closeSettings();
            }
        });

        connectWS();
    </script>
</body>
</html>
